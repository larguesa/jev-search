[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-search"
version = "0.2.0"
description = "Bounded semantic line search using OpenRouter or TypeSafe"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ricardo Pupo Larguesa"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.scripts]
jev-search = "jev_search:main"

[project.urls]
Repository = "https://github.com/larguesa/jev-search"

[tool.setuptools]
py-modules = ["jev_search"]
include-package-data = false
