name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Prepare build tools (no inference)
        run: python -m pip install build setuptools wheel
      - name: Offline tests and packaging
        env:
          JEV_SEARCH_API_KEY: ''
          PIP_NO_INDEX: '1'
        run: |
          python -m tests
          python -m unittest discover -v
          python -m tests.benchmark
          python -m build --no-isolation
          python -m venv "$RUNNER_TEMP/jev-cli"
          "$RUNNER_TEMP/jev-cli/bin/pip" install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/jev-cli/bin/python" -c 'import jev_search; from importlib.metadata import version, requires; assert version("jev-search") == "0.1.1"; assert not requires("jev-search")'
          "$RUNNER_TEMP/jev-cli/bin/jev-search" --help
          "$RUNNER_TEMP/jev-cli/bin/jev-search" --query greeting "$GITHUB_WORKSPACE/tests/fixtures/synthetic.txt" > dry-run.json
          python -c 'import json; d=json.load(open("dry-run.json")); assert d["mode"] == "dry-run" and len(d["rows"]) == 20'
