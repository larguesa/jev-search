name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Prepare build tools (no inference)
        run: python -m pip install build 'setuptools>=77' wheel
      - name: Offline tests and packaging
        env:
          JEV_SEARCH_API_KEY: ''
          PIP_NO_INDEX: '1'
        run: |
          python -m tests
          python -m unittest discover -v
          python -m tests.benchmark --dry-run
          python -m build --no-isolation
          python -m venv "$RUNNER_TEMP/jev-cli"
          bin="$RUNNER_TEMP/jev-cli/bin"
          if [ "$RUNNER_OS" = Windows ]; then bin="$RUNNER_TEMP/jev-cli/Scripts"; fi
          "$bin/pip" install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$bin/python" -c 'import jev_search; from importlib.metadata import version, requires; assert version("jev-search") == "0.2.0"; assert not requires("jev-search")'
          "$bin/jev-search" --help
          "$bin/jev-search" --dry-run --query greeting "$GITHUB_WORKSPACE/tests/fixtures/synthetic.txt" > dry-run.json
          python -c 'import json; d=json.load(open("dry-run.json")); assert d["mode"] == "dry-run" and len(d["rows"]) == 20'
